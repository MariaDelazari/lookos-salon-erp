services:
  postgres:
    image: postgres:17
    container_name: lookos_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lookos

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: lookos_api

    depends_on:
      - postgres

    ports:
      - "3333:3333"
      - "5555:5555"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lookos?schema=public

volumes:
  postgres_data: